<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ受付</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
      }

      body {
        margin: 0;
        padding: 48px 20px;
      }

      main {
        max-width: 680px;
        margin: 0 auto;
      }

      .card {
        padding: 32px;
        border: 1px solid #e1e7f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(34 53 84 / 8%);
      }

      h1, h2 {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: 1.8rem;
      }

      .intro {
        margin-top: 0;
        color: #596579;
      }

      form {
        display: grid;
        gap: 18px;
        margin-top: 28px;
      }

      label {
        display: grid;
        gap: 7px;
        font-weight: 600;
      }

      input, textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd4e1;
        border-radius: 8px;
        font: inherit;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      button {
        justify-self: start;
        padding: 11px 20px;
        border: 0;
        border-radius: 8px;
        background: #2459c4;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      #status {
        min-height: 1.5em;
        margin: 0;
      }

      #status.error {
        color: #b42318;
      }

      .submissions {
        margin-top: 28px;
      }

      .submission {
        padding: 14px 0;
        border-top: 1px solid #e7ebf2;
      }

      .submission p {
        margin: 6px 0;
        white-space: pre-wrap;
      }

      .meta {
        color: #596579;
        font-size: 0.9rem;
      }

      @media (max-width: 520px) {
        body {
          padding: 20px 12px;
        }

        .card {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>お問い合わせ受付</h1>
        <p class="intro">以下のフォームからお問い合わせください。</p>

        <form id="contact-form">
          <label>
            お名前
            <input name="name" autocomplete="name" maxlength="100" required>
          </label>
          <label>
            メールアドレス
            <input name="email" type="email" autocomplete="email" maxlength="254" required>
          </label>
          <label>
            お問い合わせ内容
            <textarea name="message" maxlength="5000" required></textarea>
          </label>
          <button type="submit">送信する</button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>

        <section class="submissions" aria-labelledby="submissions-heading">
          <h2 id="submissions-heading">受付済みのお問い合わせ</h2>
          <div id="submissions" aria-live="polite">読み込み中...</div>
        </section>
      </section>
    </main>

    <script>
      const form = document.querySelector("#contact-form");
      const status = document.querySelector("#status");
      const submissions = document.querySelector("#submissions");
      const submitButton = form.querySelector("button");

      function addText(parent, tag, value, className) {
        const element = document.createElement(tag);
        element.textContent = value;
        if (className) {
          element.className = className;
        }
        parent.append(element);
      }

      async function loadSubmissions() {
        const response = await fetch("/api/submissions");
        if (!response.ok) {
          throw new Error("受付内容を読み込めませんでした。");
        }

        const items = await response.json();
        submissions.replaceChildren();
        if (items.length === 0) {
          submissions.textContent = "まだお問い合わせはありません。";
          return;
        }

        for (const item of items) {
          const entry = document.createElement("article");
          entry.className = "submission";
          addText(entry, "strong", item.name);
          addText(entry, "p", item.message);
          addText(
            entry,
            "p",
            `${item.email} ・ ${new Date(item.created_at).toLocaleString("ja-JP")}`,
            "meta"
          );
          submissions.append(entry);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.className = "";
        status.textContent = "";
        submitButton.disabled = true;

        try {
          const data = Object.fromEntries(new FormData(form));
          const response = await fetch("/api/submissions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });
          if (!response.ok) {
            throw new Error("送信に失敗しました。入力内容をご確認ください。");
          }

          form.reset();
          status.textContent = "お問い合わせを受け付けました。";
          await loadSubmissions();
        } catch (error) {
          status.className = "error";
          status.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      loadSubmissions().catch((error) => {
        submissions.textContent = error.message;
      });
    </script>
  </body>
</html>
